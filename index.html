<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARS - How To Use</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="content">
            <div class="header-row">
                <img src="images/logo-ars-nails.png" alt="ARS Nails Logo" class="logo">
                
                <div class="lang-switcher">
                    <button class="lang-btn active" data-lang="en">En</button>
                    <button class="lang-btn" data-lang="ru">Ru</button>
                </div>
            </div>
            
            <div class="links-container">
                <a href="https://arsnails.com" target="_blank" class="link-button shop-button" id="link-shop">
                    <span class="button-text" id="text-shop">Nail wraps shop</span>
                    <span class="button-arrow">→</span>
                </a>
                
                <a href="https://arsnails.ru/howtouse" target="_blank" class="link-button instruction-button" id="link-instruction">
                    <span class="button-text" id="text-instruction">How to apply nail wraps instruction</span>
                    <span class="button-arrow">→</span>
                </a>
                
                <a href="https://academy.arsnails.ru" target="_blank" class="link-button course-button" id="link-course">
                    <span class="button-text" id="text-course">"Nail wraps" online course</span>
                    <span class="button-arrow">→</span>
                </a>
            </div>
        </div>
        
        <div id="stars-container" class="background-decoration">
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
